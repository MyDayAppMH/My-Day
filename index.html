<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Day">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171c" media="(prefers-color-scheme: dark)">
<title>My Day</title>
<style>
:root {
  --bg: #f5f6fa; --card: #ffffff; --ink: #1c2027; --muted: #69727d; --line: #e3e6ed;
  --day: #3b5bdb; --day-soft: #e4e9fc; --good: #2b8a3e; --good-soft: #dcf2e0; --warn: #c2650a; --warn-soft: #fbead6;
  --danger: #b3261e; --accent: #1c2027; --accent-ink: #ffffff; --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171c; --card: #1e2128; --ink: #eceef2; --muted: #98a1ad; --line: #2c313a;
    --day: #7c9aff; --day-soft: #232c4d; --good: #5fcf7a; --good-soft: #1b3323; --warn: #f0a04b; --warn-soft: #3a2b18;
    --danger: #f2736b; --accent: #eceef2; --accent-ink: #15171c; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #15171c; --card: #1e2128; --ink: #eceef2; --muted: #98a1ad; --line: #2c313a;
  --day: #7c9aff; --day-soft: #232c4d; --good: #5fcf7a; --good-soft: #1b3323; --warn: #f0a04b; --warn-soft: #3a2b18;
  --danger: #f2736b; --accent: #eceef2; --accent-ink: #15171c; --shadow: none;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
a { color: var(--day); }
.wrap { max-width: 560px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 16px 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.card h3 { margin: 0 0 8px; font-size: 15px; }
.stack > * + * { margin-top: 12px; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.datenav { display: flex; align-items: center; gap: 4px; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 20px; line-height: 1; }
.iconbtn:disabled { opacity: .35; cursor: default; }
.datelabel { min-width: 130px; text-align: center; font-weight: 600; }
.datelabel small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.pill { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.pill.bad { color: var(--danger); border-color: var(--danger); }

.shape { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
.shape b { color: var(--ink); }
.allday { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.allday span { background: var(--day-soft); color: var(--day); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
.ev { display: flex; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 2px; align-items: flex-start; }
.ev:first-of-type { border-top: 0; }
.ev .t { min-width: 56px; font-weight: 650; font-size: 15px; }
.ev .t small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.ev .nm { min-width: 0; flex: 1; }
.ev .name { display: block; font-weight: 600; overflow-wrap: anywhere; }
.ev .sub { display: block; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.ev.past { opacity: .5; }
.ev.next { background: var(--day-soft); border-radius: 12px; border-top-color: transparent; padding-left: 10px; padding-right: 10px; margin: 2px -8px; width: calc(100% + 16px); }
.badge { display: inline-block; border-radius: 6px; padding: 1px 7px; font-size: 11px; margin-left: 6px; vertical-align: 1px; background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.badge.day { background: var(--day-soft); color: var(--day); }
.free { font-size: 12px; color: var(--muted); padding: 2px 0 2px 68px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.stat .lbl { font-size: 12px; color: var(--muted); }
.stat .val { font-size: 20px; font-weight: 650; margin-top: 2px; }
.stat .sub { font-size: 12px; color: var(--muted); }

.grouphd { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 2px 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.grouphd:first-child { margin-top: 0; }
.grouphd.bad { color: var(--danger); }
.task { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.task:first-of-type { border-top: 0; }
.chk { flex: none; width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--muted); background: none; padding: 0; display: grid; place-items: center; font-size: 15px; line-height: 1; color: transparent; }
.chk.on { background: var(--good); border-color: var(--good); color: #fff; }
.task .tt { min-width: 0; flex: 1; text-align: left; background: none; border: 0; padding: 4px 0; }
.task .tt span { display: block; overflow-wrap: anywhere; }
.task .tt .sub { font-size: 12px; color: var(--muted); }
.task.done .tt .tn { text-decoration: line-through; color: var(--muted); }
.addrow { width: 100%; margin-top: 10px; border: 1px dashed var(--line); background: none; border-radius: 12px; padding: 10px; color: var(--day); font-weight: 600; }
.empty { color: var(--muted); font-size: 14px; padding: 4px 2px; }
.nudge { background: var(--day-soft); border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.nudge b { display: block; }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line);
  display: flex; padding-bottom: env(safe-area-inset-bottom); }
.nav button { flex: 1; border: 0; background: none; padding: 12px 0 14px; font-size: 13px; color: var(--muted); }
.nav button.on { color: var(--day); font-weight: 650; }

.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; background: var(--bg); border-radius: 20px 20px 0 0;
  padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
.sheet h2 { margin: 0 0 4px; font-size: 19px; overflow-wrap: anywhere; }
.row { display: flex; gap: 8px; }
.field { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.field:focus { outline: 2px solid var(--day); outline-offset: -1px; }
textarea.field { min-height: 92px; resize: vertical; }
.btn { border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); padding: 12px 18px; font-weight: 650; text-decoration: none; display: inline-block; }
.btn.day { background: var(--day); color: #fff; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.btn:disabled { opacity: .4; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 13px; font-size: 14px; }
.chip.on { background: var(--day); color: #fff; border-color: var(--day); }
.lbl2 { font-size: 13px; color: var(--muted); margin: 14px 2px 6px; display: block; }
.people { font-size: 14px; margin: 4px 0; }
.people .r { display: inline-block; width: 18px; color: var(--muted); }
.desc { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; max-height: 220px; overflow: auto; }

.moods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.moods button { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 0 6px; font-size: 26px; line-height: 1.1; }
.moods button small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.moods button.on { border-color: var(--day); background: var(--day-soft); box-shadow: 0 0 0 1px var(--day) inset; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale button { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 0; font-weight: 650; }
.scale button.on { border-color: var(--day); background: var(--day); color: #fff; }
.scalehint { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 3px; }
.saved { font-size: 12px; color: var(--muted); text-align: right; min-height: 16px; }
.facts li { margin: 3px 0; }
.facts ul { margin: 4px 0 8px; padding-left: 18px; font-size: 14px; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: none; padding: 8px 14px; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--bg); font-weight: 650; }
.hrow { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 2px; }
.hrow:first-of-type { border-top: 0; }
.hrow .em { font-size: 26px; width: 34px; text-align: center; }
.hrow .hd { font-weight: 600; }
.hrow .sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 15px; }
.kv .k { color: var(--muted); }
svg text { fill: var(--muted); font-size: 10px; font-family: inherit; }

.set h3 { margin: 0 0 8px; font-size: 15px; }
.set p { margin: 6px 0; font-size: 14px; }
.errbox { background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; word-break: break-word; margin-top: 8px; }
.okbox { background: var(--good-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; word-break: break-word; margin-top: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 30; max-width: 92vw;
  background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; display: flex; gap: 14px; align-items: center; font-size: 14px; }
.toast button { background: none; border: 0; color: var(--day); font-weight: 700; padding: 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav" id="nav"></nav>
<div id="overlay"></div>
<div id="toast"></div>

<script>
'use strict';
const BUILD = '2026-10-31.1';
const STORE_KEY = 'myday.v1';
const MOODS = [['😞', 'Rough'], ['🙁', 'Meh'], ['😐', 'Okay'], ['🙂', 'Good'], ['😄', 'Great']];
const BASE_TAGS = ['Work', 'Sport', 'Social', 'Family', 'Errands', 'Learning', 'Rest', 'Travel', 'Outdoors', 'Creative'];
const WORK_START = 9, WORK_END = 18; // the window used to find your longest free block

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function ymd(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function parseYmd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
const today = () => ymd(new Date());
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmt(n) { return Math.round(n).toLocaleString(); }
function dur(min) { const h = Math.floor(min / 60), m = Math.round(min % 60); return h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}m`; }
const timeStr = iso => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function dayLabel(s) {
  const t = today();
  if (s === t) return 'Today';
  if (s === addDays(t, 1)) return 'Tomorrow';
  if (s === addDays(t, -1)) return 'Yesterday';
  return parseYmd(s).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
}
const longDate = s => parseYmd(s).toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
const shortDate = s => parseYmd(s).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
const evKey = e => `${e.uid}|${e.start}`;
const dueDay = t => (t.due ? t.due.slice(0, 10) : null);
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

/* ---------- state ---------- */
function blank() { return { reviews: {}, prep: {}, health: {}, cache: {}, tasks: null, tags: [], settings: { baseUrl: '', appKey: '' }, status: {}, healthAt: 0, demo: false }; }
function load() {
  try { return Object.assign(blank(), JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); }
  catch { return blank(); }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch { toast('Could not save: browser storage is full or blocked.'); }
}
let S = load();
let view = 'today';
let viewDate = today();
let reviewDate = new Date().getHours() < 12 ? addDays(today(), -1) : today(); // mornings default to logging yesterday
let histDays = 30;
let loading = false;

/* ---------- Worker access ---------- */
function baseUrl() {
  const b = (S.settings.baseUrl || '').trim().replace(/\/$/, '');
  return /^https?:\/\//.test(b) ? b : null;
}
async function api(path, opts = {}) {
  const base = baseUrl();
  if (base === null) throw new Error('Enter your Worker address in Settings first (it starts with https://).');
  const headers = { ...(opts.headers || {}), 'X-App-Key': S.settings.appKey };
  if (opts.body) headers['Content-Type'] = 'application/json';
  const res = await fetch(base + path, { ...opts, headers });
  let body = null;
  try { body = await res.json(); } catch { /* non-JSON */ }
  if (!res.ok) throw new Error((body && body.error) || `Server returned ${res.status}`);
  return body;
}
const connected = () => !!(S.settings.appKey && baseUrl()) && !S.demo;

// Load everything for one day. Each part can fail on its own; whatever worked is kept and the rest keeps its saved copy.
async function loadDay(date) {
  if (!connected()) return;
  loading = true; if (view !== 'settings') render();
  const from = parseYmd(date).toISOString(), to = parseYmd(addDays(date, 1)).toISOString();
  const [cal, tasks, health] = await Promise.allSettled([
    api(`/api/calendar?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`),
    api(`/api/tasks?date=${date}`),
    api(`/api/days?from=${addDays(date, -1)}&to=${date}`),
  ]);
  const at = Date.now();
  if (cal.status === 'fulfilled') {
    S.cache[date] = { at, events: cal.value.events, calendars: cal.value.calendars, errors: cal.value.errors };
    S.status.cal = { at, ok: true, message: cal.value.errors.length ? cal.value.errors.map(e => `${e.calendar}: ${e.message}`).join('\n') : '' };
  } else S.status.cal = { at, ok: false, message: cal.reason.message };
  if (tasks.status === 'fulfilled') {
    const prev = S.tasks || { doneOn: {} };
    S.tasks = { at, open: tasks.value.open, doneOn: { ...prev.doneOn, [date]: tasks.value.doneOn } };
    S.status.tasks = { at, ok: true, message: '' };
  } else S.status.tasks = { at, ok: false, message: tasks.reason.message };
  if (health.status === 'fulfilled') { mergeHealth(health.value); S.status.health = { at, ok: !health.value.errors?.length, message: (health.value.errors || []).map(e => `${e.type}: ${e.message}`).join('\n') }; }
  else S.status.health = { at, ok: false, message: health.reason.message };
  for (const d of Object.keys(S.cache).sort().slice(0, -14)) delete S.cache[d]; // keep the 14 most recent days
  loading = false; save(); render();
}
function mergeHealth(out) {
  for (const [d, v] of Object.entries(out.days || {})) S.health[d] = Object.assign(S.health[d] || {}, v);
  S.healthAt = Date.now();
}
async function syncHealth(days) {
  if (!connected()) return;
  try {
    const to = today();
    mergeHealth(await api(`/api/days?from=${addDays(to, -(days - 1))}&to=${to}`));
    S.status.health = { at: Date.now(), ok: true, message: '' };
  } catch (e) { S.status.health = { at: Date.now(), ok: false, message: e.message }; }
  save(); render();
}

/* ---------- day shape ---------- */
function mergedBusy(events, date) {
  const lo = parseYmd(date).getTime() + WORK_START * 36e5, hi = parseYmd(date).getTime() + WORK_END * 36e5;
  const iv = events.filter(e => !e.allDay && e.busy).map(e => [Math.max(lo, Date.parse(e.start)), Math.min(hi, Date.parse(e.end))]).filter(([a, b]) => b > a).sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const x of iv) { if (out.length && x[0] <= out.at(-1)[1]) out.at(-1)[1] = Math.max(out.at(-1)[1], x[1]); else out.push([...x]); }
  return { out, lo, hi };
}
function dayShape(events, date) {
  const timed = events.filter(e => !e.allDay);
  if (!timed.length) return null;
  const mins = timed.filter(e => e.busy).reduce((a, e) => a + (Date.parse(e.end) - Date.parse(e.start)) / 6e4, 0);
  const { out, lo, hi } = mergedBusy(events, date);
  let best = null, cur = lo;
  for (const [a, b] of [...out, [hi, hi]]) { if (a - cur > (best ? best[1] - best[0] : 0)) best = [cur, a]; cur = Math.max(cur, b); }
  return { count: timed.length, mins, first: timed[0].start, last: timed.at(-1).end, free: best && best[1] - best[0] >= 30 * 6e4 ? best : null };
}

/* ---------- rendering ---------- */
function render() {
  $('nav').innerHTML = [['today', 'Day ahead'], ['review', 'Review'], ['history', 'History'], ['settings', 'Settings']]
    .map(([k, l]) => `<button data-v="${k}" class="${view === k ? 'on' : ''}">${l}</button>`).join('');
  $('nav').querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.v));
  const app = $('app');
  app.innerHTML = view === 'today' ? aheadHtml() : view === 'review' ? reviewHtml() : view === 'history' ? historyHtml() : settingsHtml();
  bind(app);
}
function go(v) {
  view = v; render(); window.scrollTo(0, 0);
  if (v === 'review') loadDay(reviewDate);
  if (v === 'today') loadDay(viewDate);
}
function pill() {
  if (!connected() && !S.demo) return `<button class="pill" data-act="goto-settings">Not connected</button>`;
  if (S.demo) return `<span class="pill">Demo data</span>`;
  if (loading) return `<span class="pill">Updating…</span>`;
  const bad = ['cal', 'tasks', 'health'].filter(k => S.status[k] && !S.status[k].ok);
  if (bad.length) return `<button class="pill bad" data-act="goto-settings">${bad.length} problem${bad.length > 1 ? 's' : ''} · details</button>`;
  const at = Math.max(0, ...['cal', 'tasks'].map(k => (S.status[k] || {}).at || 0));
  return `<button class="pill" data-act="refresh">${at ? 'Updated ' + new Date(at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : 'Refresh'}</button>`;
}
function dateBar(date, prevAct, nextAct) {
  return `<div class="topbar"><div class="datenav">
    <button class="iconbtn" data-act="${prevAct}" aria-label="Previous day">‹</button>
    <div class="datelabel">${dayLabel(date)}<small>${date === today() || ['Yesterday', 'Tomorrow'].includes(dayLabel(date)) ? longDate(date) : parseYmd(date).getFullYear()}</small></div>
    <button class="iconbtn" data-act="${nextAct}" aria-label="Next day">›</button></div>${pill()}</div>`;
}

/* ----- day ahead ----- */
function healthTiles(date) {
  const h = S.health[date] || {}, y = S.health[addDays(date, -1)] || {};
  const t = [];
  if (h.sleepMinutes != null) t.push(['Sleep', dur(h.sleepMinutes), h.sleepDeepMin != null ? `deep ${Math.round(h.sleepDeepMin)}m · REM ${Math.round(h.sleepRemMin || 0)}m` : '']);
  if (h.restingHr != null) t.push(['Resting HR', Math.round(h.restingHr), 'bpm']);
  if (y.steps != null) t.push(['Steps', fmt(y.steps), 'the day before']);
  return t.length ? `<div class="stats">${t.map(([l, v, s]) => `<div class="stat"><div class="lbl">${l}</div><div class="val num">${v}</div><div class="sub">${esc(s) || '&nbsp;'}</div></div>`).join('')}</div>` : '';
}
function eventRow(e, nextKey, now) {
  const ended = Date.parse(e.end) <= now, dm = (Date.parse(e.end) - Date.parse(e.start)) / 6e4;
  const bits = [e.location && esc(e.location.split('\n')[0]), e.video && 'Video call', e.attendeeCount > 1 && `${e.attendeeCount} people`].filter(Boolean).join(' · ');
  const badge = e.response === 'tentative' ? '<span class="badge">maybe</span>' : e.response === 'needsAction' ? '<span class="badge">no reply</span>' : '';

      <div class="muted" style="font-size:13px">${last ? `Last contact ${ago(last)}` : 'No contact logged yet'}${p.how ? ' · ' + esc(p.how) : ''}</div>
      ${p.summary ? `<div style="font-size:14px;margin-top:6px;white-space:pre-wrap">${esc(p.summary)}</div>` : ''}
      ${p.tasks.length ? `<div class="muted" style="font-size:12px;margin-top:8px">Open tasks</div>${p.tasks.map(t => `<div style="font-size:14px">• ${esc(t.title)}${t.due ? ` <span class="muted">(${shortDate(t.due.slice(0, 10))})</span>` : ''}${t.waiting ? ' <span class="badge">waiting</span>' : ''}</div>`).join('')}` : ''}
      <button class="addrow" style="margin-top:10px" data-addfor="${esc(p.id)}" data-name="${esc((p.name || '').split(' ')[0])}">+ Task for ${esc((p.name || 'them').split(' ')[0])}</button></div>`;
  }).join('');
  const names = r.unmatched.map(m => (e.attendees.find(a => (a.email || '').toLowerCase() === m) || {}).name || m);
  return `<span class="lbl2">From your CRM</span>${people || '<p class="muted" style="margin:0">Nobody in this meeting is in your CRM yet.</p>'}
    ${names.length && people ? `<p class="muted" style="font-size:12px;margin:8px 0 0">Not in your CRM: ${esc(names.join(', '))}</p>` : ''}`;
}
async function loadBrief(e, key) {
  const emails = e.attendees.filter(a => !a.self && a.email).map(a => a.email);
  if (!emails.length || (!connected() && !S.demo)) return;
  $('crm').innerHTML = '<span class="lbl2">From your CRM</span><p class="muted" style="margin:0">Looking up the attendees…</p>';
  try {
    const r = crmCache[key] || (crmCache[key] = S.demo ? demoBrief(emails) : await api('/api/brief', { method: 'POST', body: JSON.stringify({ emails }) }));
    const box = $('crm'); if (!box) return;
    box.innerHTML = crmHtml(r, e);
    box.querySelectorAll('[data-addfor]').forEach(b => b.onclick = () => openAddTask({ id: b.dataset.addfor, name: b.dataset.name }));
  } catch (err) {
    delete crmCache[key];
    const box = $('crm'); if (box) box.innerHTML = `<span class="lbl2">From your CRM</span><div class="errbox">${esc(err.message)}</div>`;
  }
}
function demoBrief(emails) {
  return { unmatched: emails.slice(1), people: [{ id: 'demo-p1', url: '#', name: 'Dana Fox', email: emails[0], role: 'CFO', company: 'Acme Corp', tier: 'A - Key', summary: 'Met at the Vienna summit in June. Interested in a pilot for Q1; asked for pricing and two references. Last call went well.', how: 'Met at a conference', lastContacted: addDays(today(), -26), followStatus: 'Overdue', nextFollowUp: null, latestInteraction: null, latestMeeting: null,
    tasks: [{ id: 'demo-1', title: 'Send proposal to Acme', due: addDays(today(), -1), status: 'Not started', waiting: false }, { id: 'demo-w', title: 'Dana to confirm budget', due: null, status: 'Not started', waiting: true }] }] };
}
function openTask(id) {
  const t = findTask(id); if (!t) return;
  openSheet(`<h2>${esc(t.title)}</h2>
    <p class="muted" style="margin:2px 0 10px">${[t.status, dueDay(t) ? 'due ' + shortDate(dueDay(t)) : 'no due date', t.types.join(', ')].filter(Boolean).join(' · ')}</p>
    ${t.next ? `<span class="lbl2">Next step</span><div>${linkify(t.next)}</div>` : ''}
    <div class="row" style="margin-top:14px;flex-wrap:wrap"><button class="btn day" id="tDone">${t.status === 'Done' ? 'Mark not done' : 'Mark done'}</button>
      <a class="btn ghost" href="${esc(t.url)}" target="_blank" rel="noopener">Open in Notion</a><button class="btn ghost" id="tClose">Close</button></div>`);
  $('tDone').onclick = () => { closeSheet(); toggleTask(id); };
  $('tClose').onclick = closeSheet;
}
function findTask(id) {
  if (!S.tasks) return null;
  return S.tasks.open.find(t => t.id === id) || Object.values(S.tasks.doneOn).flat().find(t => t.id === id) || null;
}
function openAddTask(person) {
  let due = viewDate >= today() ? viewDate : today(), type = '';
  const draw = () => {
    $('dueChips').innerHTML = [[today(), 'Today'], [addDays(today(), 1), 'Tomorrow'], ['', 'No date']].map(([d, l]) => `<button class="chip ${due === d ? 'on' : ''}" data-d="${d}">${l}</button>`).join('');
    $('typeChips').innerHTML = [['', 'None'], ['Personal', 'Personal'], ['Work', 'Work']].map(([v, l]) => `<button class="chip ${type === v ? 'on' : ''}" data-t="${v}">${l}</button>`).join('');
    $('dueChips').querySelectorAll('button').forEach(b => b.onclick = () => { due = b.dataset.d; $('dueDate').value = due; draw(); });
    $('typeChips').querySelectorAll('button').forEach(b => b.onclick = () => { type = b.dataset.t; draw(); });
  };
  openSheet(`<h2>New task</h2><p class="muted" style="margin:2px 0 8px">Goes straight into your Notion task database${person ? `, linked to ${esc(person.name || 'this person')} in your CRM` : ''}.</p>
    <input class="field" id="tTitle" placeholder="${person ? `e.g. Follow up with ${esc(person.name)}` : 'What needs doing?'}" maxlength="200" autofocus>
    <span class="lbl2">Due</span><div class="chips" id="dueChips"></div>
    <input class="field" id="dueDate" type="date" style="margin-top:8px" value="${due}">
    <span class="lbl2">Type</span><div class="chips" id="typeChips"></div>
    <div class="row" style="margin-top:16px"><button class="btn day" id="tSave">Add task</button><button class="btn ghost" id="tCancel">Cancel</button></div>`);
  draw();
  $('dueDate').onchange = () => { due = $('dueDate').value; draw(); };
  $('tCancel').onclick = closeSheet;
  $('tSave').onclick = async () => {
    const title = $('tTitle').value.trim(); if (!title) return $('tTitle').focus();
    $('tSave').disabled = true;
    try {
      if (S.demo) S.tasks.open.push({ id: 'demo-' + Date.now(), title, status: 'Not started', due: due || null, done: null, types: type ? [type] : [], tags: [], waiting: false, crm: !!person, people: [], next: '', url: '#' });
      else {
        const r = await api('/api/tasks/add', { method: 'POST', body: JSON.stringify({ title, due: due || undefined, type: type || undefined, person: person ? person.id : undefined }) });
        S.tasks.open.push(r.task);
      }
      save(); closeSheet(); render(); toast('Task added');
    } catch (e) { $('tSave').disabled = false; toast('Could not add: ' + e.message); }
  };
}
function toggleTask(id) {
  const T = S.tasks, t = findTask(id); if (!t || !T) return;
  const wasDone = t.status === 'Done', doneList = T.doneOn[today()] || (T.doneOn[today()] = []);
  const prevStatus = wasDone ? 'Not started' : t.status;
  const apply = nowDone => {
    if (nowDone) { T.open = T.open.filter(x => x.id !== id); if (!doneList.some(x => x.id === id)) doneList.push({ ...t, status: 'Done', done: today() }); }
    else { T.doneOn[today()] = doneList.filter(x => x.id !== id); if (!T.open.some(x => x.id === id)) T.open.push({ ...t, status: prevStatus, done: null }); }
    save(); render();
  };
  const send = async nowDone => {
    if (S.demo) return;
    await api(nowDone ? '/api/tasks/done' : '/api/tasks/reopen', { method: 'POST', body: JSON.stringify(nowDone ? { id, date: today() } : { id, status: prevStatus }) });
  };
  const nowDone = !wasDone;
  apply(nowDone);
  send(nowDone).then(() => toast(nowDone ? `Done · ${t.title}` : `Reopened · ${t.title}`, 'Undo', () => { apply(!nowDone); send(!nowDone).catch(e => toast('Undo failed in Notion: ' + e.message)); }))
    .catch(e => { apply(!nowDone); toast('Notion did not accept that: ' + e.message); });
}

/* ---------- events ---------- */
function bind(root) {
  root.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => openEvent(b.dataset.ev));
  root.querySelectorAll('[data-done]').forEach(b => b.onclick = () => toggleTask(b.dataset.done));
  root.querySelectorAll('[data-task]').forEach(b => b.onclick = () => openTask(b.dataset.task));
  root.querySelectorAll('[data-rev]').forEach(b => b.onclick = () => { reviewDate = b.dataset.rev; view = 'review'; render(); window.scrollTo(0, 0); loadDay(reviewDate); });
  root.querySelectorAll('[data-hist]').forEach(b => b.onclick = () => { histDays = +b.dataset.hist; render(); });
  root.querySelectorAll('[data-tagdel]').forEach(b => b.onclick = () => { S.tags = S.tags.filter(t => t !== b.dataset.tagdel); save(); render(); });
  root.querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b.dataset.act));
  if (view === 'review') bindReview(root);
  if (view === 'settings') { const f = $('importFile'); if (f) f.onchange = importData; }
}
async function act(a) {
  if (a === 'prev') { viewDate = addDays(viewDate, -1); render(); loadDay(viewDate); }
  else if (a === 'next') { viewDate = addDays(viewDate, 1); render(); loadDay(viewDate); }
  else if (a === 'rprev') { reviewDate = addDays(reviewDate, -1); render(); loadDay(reviewDate); }
  else if (a === 'rnext') { reviewDate = addDays(reviewDate, 1); render(); loadDay(reviewDate); }
  else if (a === 'refresh') loadDay(viewDate);
  else if (a === 'goto-settings') { view = 'settings'; render(); window.scrollTo(0, 0); }
  else if (a === 'review-yesterday') { reviewDate = addDays(today(), -1); go('review'); }
  else if (a === 'add-task') openAddTask();
  else if (a === 'new-tag') {
    const t = (prompt('New tag name') || '').trim().slice(0, 20);
    if (t && ![...BASE_TAGS, ...S.tags].some(x => x.toLowerCase() === t.toLowerCase())) { S.tags.push(t); save(); }
    if (t) { const cur = (S.reviews[reviewDate] || {}).tags || []; const name = [...BASE_TAGS, ...S.tags].find(x => x.toLowerCase() === t.toLowerCase()); if (!cur.includes(name)) patchReview({ tags: [...cur, name] }); render(); }
  }
  else if (a === 'fill-notes') {
    const c = S.cache[reviewDate], done = (S.tasks && S.tasks.doneOn[reviewDate]) || [], lines = [];
    const timed = c ? c.events.filter(e => !e.allDay) : [];
    if (timed.length) lines.push('Meetings: ' + timed.map(e => `${e.title} (${timeStr(e.start)})`).join(', '));
    if (done.length) lines.push('Done: ' + done.map(t => t.title).join(', '));
    const cur = (S.reviews[reviewDate] || {}).did || '';
    const add = lines.filter(l => !cur.includes(l));
    if (add.length) { patchReview({ did: (cur ? cur.trimEnd() + '\n' : '') + add.join('\n') }); render(); }
  }
  else if (a === 'clear-review') { if (confirm('Clear this day\'s review?')) { delete S.reviews[reviewDate]; save(); render(); } }
  else if (a === 'save-conn') { saveConn(); toast('Saved'); }
  else if (a === 'from-calorie') {
    try {
      const o = (JSON.parse(localStorage.getItem('intake.v1') || '{}').settings) || {};
      if (!o.baseUrl || !o.appKey) return toast('Open Calorie tracker once and save its settings first.');
      S.settings.baseUrl = o.baseUrl; S.settings.appKey = o.appKey; save(); render(); toast('Copied from Calorie tracker');
    } catch { toast('Could not read Calorie tracker settings.'); }
  }
  else if (a === 'connect') {
    saveConn(); const base = baseUrl();
    if (base === null) return toast('Enter the Worker address first.');
    window.open(base + '/auth/start', '_blank');
  }
  else if (a === 'check') {
    saveConn();
    const out = $('checkOut'); out.innerHTML = '<p class="muted">Checking…</p>';
    try {
      const r = await api('/api/status'), cal = /calendar/.test(r.scopes || '');
      const lines = [r.connected ? 'Worker reachable, Google connected.' : 'Worker reachable, but Google is not connected yet. Tap “Connect Google”.',
        r.connected ? (cal ? 'Calendar permission: granted.' : 'Calendar permission: <b>not granted yet</b>. Tap “Connect Google” and approve calendar access.') : '',
        r.notion ? 'Notion: set up on the Worker.' : 'Notion: <b>not set up</b> on the Worker yet.'].filter(Boolean);
      out.innerHTML = `<div class="${r.connected && cal && r.notion ? 'okbox' : 'errbox'}">${lines.join('<br>')}</div>`;
    } catch (e) { out.innerHTML = `<div class="errbox">${esc(e.message)}</div>`; }
  }
  else if (a === 'sync-all') { saveConn(); await syncHealth(30); loadDay(view === 'review' ? reviewDate : viewDate); }
  else if (a === 'export') exportData();
  else if (a === 'import') $('importFile').click();
  else if (a === 'demo-on') { loadDemo(); render(); toast('Demo data loaded'); }
  else if (a === 'demo-off') { removeDemo(); render(); toast('Demo data removed'); }
  else if (a === 'force') forceRefresh();
}
function saveConn() {
  S.settings.appKey = ($('appKey') ? $('appKey').value : S.settings.appKey).trim();
  S.settings.baseUrl = ($('baseUrl') ? $('baseUrl').value : S.settings.baseUrl).trim();
  save();
}
let toastTimer;
function toast(msg, label, fn) {
  clearTimeout(toastTimer);
  $('toast').innerHTML = `<div class="toast"><span>${esc(msg)}</span>${label ? `<button id="toastBtn">${esc(label)}</button>` : ''}</div>`;
  if (label) $('toastBtn').onclick = () => { fn(); $('toast').innerHTML = ''; };
  toastTimer = setTimeout(() => { $('toast').innerHTML = ''; }, label ? 7000 : 3500);
}

/* ---------- backup / demo / refresh ---------- */
function exportData() {
  const blob = new Blob([JSON.stringify({ app: 'myday', version: 1, exportedAt: Date.now(), reviews: S.reviews, prep: S.prep, tags: S.tags }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `myday-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importData(ev) {
  const file = ev.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d.app !== 'myday' || typeof d.reviews !== 'object') throw new Error('not a backup from this app');
      let n = 0;
      for (const [date, rv] of Object.entries(d.reviews)) { const mine = S.reviews[date]; if (!mine || (rv.updatedAt || 0) > (mine.updatedAt || 0)) { S.reviews[date] = rv; n++; } }
      for (const [k, v] of Object.entries(d.prep || {})) if (!S.prep[k]) S.prep[k] = v;
      for (const t of d.tags || []) if (!S.tags.includes(t)) S.tags.push(t);
      save(); render(); toast(`Imported ${n} day${n === 1 ? '' : 's'}`);
    } catch (e) { toast('Could not import: ' + e.message); }
  };
  r.readAsText(file);
}
function loadDemo() {
  const t = today(), at = (h, m = 0, d = t) => { const x = parseYmd(d); x.setHours(h, m); return x.toISOString(); };
  const ev = (id, title, h1, m1, h2, m2, extra = {}) => ({ id, uid: id, calendar: 'Demo', title, start: at(h1, m1), end: at(h2, m2), allDay: false, location: '', description: '', video: null, link: null, response: 'accepted', busy: true, recurring: false, organizer: '', attendees: [], attendeeCount: 0, ...extra });
  S.cache[t] = { at: Date.now(), calendars: ['Demo'], errors: [], events: [
    { ...ev('d0', 'Maria’s birthday', 0, 0, 0, 0), allDay: true, start: t, end: addDays(t, 1) },
    ev('d1', 'Team standup', 9, 30, 9, 45, { video: 'https://meet.example/standup', organizer: 'Sam Lee', attendeeCount: 6, attendees: [{ name: 'Sam Lee', email: 'sam@example.com', response: 'accepted', self: false, organizer: true, optional: false }, { name: 'Priya Nair', email: 'priya@example.com', response: 'tentative', self: false, organizer: false, optional: false }, { name: 'Jonas Weber', email: 'jonas@example.com', response: 'needsAction', self: false, organizer: false, optional: true }], description: 'Quick sync. Agenda: blockers, launch date.\nNotes: https://docs.example/standup' }),
    ev('d2', 'Pitch review with Acme', 11, 0, 12, 0, { location: 'Meeting room 2', response: 'tentative', attendeeCount: 3, attendees: [{ name: 'Dana Fox', email: 'dana@acme.example', response: 'accepted', self: false, organizer: true, optional: false }], organizer: 'Dana Fox', description: 'Walk through the deck and agree next steps.' }),
    ev('d3', 'Lunch with Tom', 13, 0, 14, 0, { location: 'Café Central', busy: false }),
    ev('d4', '1:1 with manager', 15, 30, 16, 0, { video: 'https://meet.example/11', attendeeCount: 2 })] };
  const task = (id, title, due, status = 'Not started', types = ['Work']) => ({ id: 'demo-' + id, title, status, due, done: null, types, tags: [], waiting: false, crm: false, people: [], next: '', url: '#' });
  S.tasks = { at: Date.now(), open: [task('1', 'Send proposal to Acme', addDays(t, -1)), task('2', 'Prepare pitch notes', t), task('3', 'Book dentist', t, 'Not started', ['Personal']), { ...task('8', 'Dana to confirm budget', null), waiting: true, crm: true }, task('4', 'Review budget', null, 'In progress'), task('5', 'Renew passport', addDays(t, 2), 'Not started', ['Personal']), task('6', 'Plan Q1 offsite', null)],
    doneOn: { [t]: [{ ...task('7', 'Reply to Dana', t), status: 'Done', done: t }] } };
  for (let i = 1; i <= 21; i++) {
    const d = addDays(t, -i), seed = (i * 37) % 11, mood = 1 + ((seed + i) % 5);
    S.health[d] = Object.assign(S.health[d] || {}, { steps: 4000 + seed * 900, sleepMinutes: 360 + seed * 14, sleepDeepMin: 60 + seed, sleepRemMin: 80 + seed * 2, restingHr: 55 + (seed % 5), caloriesOut: 2300 + seed * 60 });
    if (i % 4 !== 0) S.reviews[d] = { mood: Math.min(5, Math.max(1, S.health[d].sleepMinutes >= 420 ? mood + 1 : mood)), energy: 1 + (seed % 5), tags: [['Work'], ['Work', 'Sport'], ['Social', 'Family'], ['Rest'], ['Work', 'Learning']][i % 5], did: ['Busy day of meetings, then a run.', 'Dinner with friends.', 'Quiet day, caught up on admin.', 'Long planning session.'][i % 4], win: i % 3 ? '' : 'Finished the report', updatedAt: Date.now() - i, demo: true };
  }
  S.health[t] = Object.assign(S.health[t] || {}, { sleepMinutes: 432, sleepDeepMin: 74, sleepRemMin: 98, restingHr: 56 });
  S.health[addDays(t, -1)] = Object.assign(S.health[addDays(t, -1)] || {}, { steps: 9120 });
  S.demo = true; S.status = {}; save();
}
function removeDemo() {
  S.demo = false; S.cache = {}; S.tasks = null; S.health = {}; S.status = {};
  for (const [d, r] of Object.entries(S.reviews)) if (r.demo) delete S.reviews[d];
  save();
}
async function forceRefresh() {
  try {
    if (navigator.serviceWorker) (await navigator.serviceWorker.getRegistrations()).forEach(r => r.unregister());
    if (window.caches) (await caches.keys()).forEach(k => caches.delete(k));
  } catch { /* ignore */ }
  location.href = location.pathname + '?v=' + Date.now();
}

/* ---------- boot ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => { /* app works without it */ });
}
render();
if (connected()) {
  loadDay(viewDate);
  if (!Object.keys(S.health).length) syncHealth(30); else if (Date.now() - S.healthAt > 30 * 60 * 1000) syncHealth(7);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !connected() || $('overlay').innerHTML) return;
  const d = view === 'review' ? reviewDate : viewDate, c = S.cache[d];
  if (view !== 'settings' && (!c || Date.now() - c.at > 5 * 60 * 1000)) loadDay(d);
});
setInterval(() => { if (view === 'today' && viewDate === today() && !$('overlay').innerHTML && !document.hidden) render(); }, 60 * 1000); // moves the "next" highlight along
</script>
