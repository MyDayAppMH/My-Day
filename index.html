<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Day">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111113" id="themeColor">
<title>My Day</title>
<style>
:root {
  --bg: #111113; --card: #19191c; --ink: #f4f4f5; --muted: #a1a1aa; --line: #2a2a2e;
  --acc: #f4f4f5; --soft: #2a2a2e; --onacc: #111113; --task: #fb7185; --tsoft: #3b1a22;
  --good: #4ade80; --good-soft: #14301f; --warn: #f0a04b; --warn-soft: #3a2b18; --danger: #fb7185;
}
:root[data-theme="light"] {
  --bg: #f4f4f5; --card: #ffffff; --ink: #18181b; --muted: #71717a; --line: #e4e4e7;
  --acc: #18181b; --soft: #e4e4e7; --onacc: #ffffff; --task: #be123c; --tsoft: #fde4ea;
  --good: #15803d; --good-soft: #dcf5e4; --warn: #b45309; --warn-soft: #fbead6; --danger: #be123c;
}
@media (prefers-color-scheme: light) {
  :root[data-theme="auto"] {
    --bg: #f4f4f5; --card: #ffffff; --ink: #18181b; --muted: #71717a; --line: #e4e4e7;
    --acc: #18181b; --soft: #e4e4e7; --onacc: #ffffff; --task: #be123c; --tsoft: #fde4ea;
    --good: #15803d; --good-soft: #dcf5e4; --warn: #b45309; --warn-soft: #fbead6; --danger: #be123c;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
a { color: var(--ink); }
.wrap { max-width: 560px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 16px 0; }
.num { font-variant-numeric: tabular-nums; }
.muted, .mu { color: var(--muted); }
.mu { font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.card h3 { margin: 0 0 6px; font-size: 15px; }
.stack > * + * { margin-top: 10px; }
.hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin: 6px 2px 8px; }
.hd h1 { margin: 0; font-size: 22px; font-weight: 600; }
.pill { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 11px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.pill.bad { color: var(--danger); border-color: var(--danger); }
.pills { display: flex; gap: 6px; }

.wk { display: flex; align-items: center; border-bottom: 1px solid var(--line); padding: 2px 0 8px; margin-bottom: 10px; }
.wk .ar { flex: none; width: 24px; height: 40px; border: 0; background: none; color: var(--muted); font-size: 20px; padding: 0; }
.wk .wd { flex: 1; border: 0; background: none; text-align: center; font-size: 12px; color: var(--muted); padding: 2px 0; }
.wk .wd b { display: block; margin: 3px auto 0; font-weight: 400; font-size: 15px; color: var(--ink); width: 36px; height: 36px; line-height: 34px; border-radius: 50%; border: 1px solid transparent; }
.wk .wd.today b { border-color: var(--muted); }
.wk .wd.on b { background: var(--acc); color: var(--onacc); font-weight: 600; border-color: var(--acc); }
.vit { display: flex; gap: 8px; }
.vit > div { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.vit b { display: block; font-size: 20px; }
.vit span { font-size: 12px; color: var(--muted); }
.thead { display: flex; gap: 8px; align-items: center; }
.tog { flex: 1; display: flex; justify-content: space-between; align-items: center; text-align: left; background: none; border: 0; padding: 4px 2px; font-size: 14px; color: var(--muted); }
.tog i { font-style: normal; font-size: 16px; }
.track { padding-top: 8px; padding-bottom: 8px; }
.cnt { display: flex; gap: 8px; align-items: stretch; }
.cnt .big { flex: 1; display: grid; grid-template-columns: 1fr auto; align-items: center; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
.cnt .big b { font-size: 24px; }
.cnt .big small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.sm { min-width: 44px; height: 40px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; font-size: 20px; font-weight: 600; }
.sm:disabled { opacity: .35; }
.drow { display: flex; align-items: center; gap: 10px; padding: 4px 2px; }
.drow span { flex: 1; font-size: 15px; }
.drow b { min-width: 24px; text-align: center; font-size: 18px; }
.tick { display: flex; align-items: center; gap: 10px; padding: 8px 2px; font-size: 15px; }
.tick input { width: 22px; height: 22px; accent-color: var(--acc); }
.health { margin: 0 2px 8px; font-size: 13px; color: var(--muted); }
.allday { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.allday span { background: var(--soft); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
.shape { font-size: 13px; color: var(--muted); margin: 6px 2px 4px; }
.shape b { color: var(--ink); font-weight: 500; }

.tl { position: relative; margin: 6px 0 4px; user-select: none; -webkit-user-select: none; }
.tl .hl { position: absolute; left: 46px; right: 0; border-top: 1px solid var(--line); pointer-events: none; }
.tl .hr { position: absolute; left: 0; font-size: 12px; color: var(--muted); pointer-events: none; }
.tev { position: absolute; text-align: left; border: 0; border-left: 4px solid var(--acc); background: var(--soft); border-radius: 0 10px 10px 0; padding: 3px 8px; font-size: 13px; overflow: hidden; line-height: 1.25; }
.tev b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tev span { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tev.n { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--muted); }
.tev.past { opacity: .5; }
.tev.next { box-shadow: 0 0 0 1px var(--acc) inset; }
.ttk { position: absolute; display: flex; align-items: center; gap: 6px; border: 1px solid var(--task); background: var(--tsoft); border-radius: 10px; padding: 0 8px 0 4px; font-size: 13px; overflow: hidden; }
.ttk .chk { width: 22px; height: 22px; border-radius: 7px; font-size: 12px; }
.ttk .nm { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--task); font-size: 13px; }
.now { position: absolute; left: 40px; right: 0; border-top: 2px solid var(--task); z-index: 2; pointer-events: none; }
.now:before { content: ""; position: absolute; left: -4px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--task); }
.badge { display: inline-block; border-radius: 6px; padding: 1px 7px; font-size: 11px; margin-left: 6px; vertical-align: 1px; background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.badge.day { background: var(--soft); color: var(--ink); }

.grouphd { display: flex; justify-content: space-between; align-items: baseline; margin: 10px 2px 2px; font-size: 12px; color: var(--muted); }
.grouphd:first-child { margin-top: 0; }
.grouphd.bad { color: var(--danger); }
.task { display: flex; align-items: center; gap: 12px; padding: 3px 0; border-top: 1px solid var(--line); }
.task:first-of-type { border-top: 0; }
.chk { flex: none; width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--muted); background: none; padding: 0; display: grid; place-items: center; font-size: 15px; line-height: 1; color: transparent; }
.chk.on { background: var(--good); border-color: var(--good); color: var(--bg); }
.task .tt { min-width: 0; flex: 1; text-align: left; background: none; border: 0; padding: 4px 0; }
.task .tt span { display: block; overflow-wrap: anywhere; }
.task .tt .sub { font-size: 12px; color: var(--muted); }
.task.done .tt .tn { text-decoration: line-through; color: var(--muted); }
.tray > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-weight: 600; font-size: 15px; }
.tray > summary::-webkit-details-marker { display: none; }
.tray > summary .mini { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 3px 11px; font-size: 13px; font-weight: 600; }
.tray .body { margin-top: 6px; }
.addrow { width: 100%; margin-top: 8px; border: 1px dashed var(--line); background: none; border-radius: 12px; padding: 9px; color: var(--ink); font-weight: 600; }
.empty { color: var(--muted); font-size: 14px; padding: 4px 2px; margin: 0; }
.nudge { background: var(--soft); border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.nudge b { display: block; }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); }
.nav button { flex: 1; border: 0; background: none; padding: 8px 0 10px; font-size: 12px; color: var(--muted); position: relative; }
.nav button i { display: block; font-size: 21px; line-height: 1.2; font-style: normal; }
.nav button.on { color: var(--ink); font-weight: 600; }
.nav .nb { position: absolute; top: 3px; left: 56%; background: var(--task); color: var(--bg); font-size: 11px; font-weight: 700; border-radius: 9px; min-width: 17px; height: 17px; line-height: 17px; }
.fab { position: fixed; right: 18px; bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 5; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--acc); color: var(--onacc); font-size: 28px; line-height: 1; box-shadow: 0 6px 18px rgba(0,0,0,.35); }

.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
.sheet h2 { margin: 0 0 4px; font-size: 19px; overflow-wrap: anywhere; }
.row { display: flex; gap: 8px; }
.field { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 8px; }
.field:focus { outline: 2px solid var(--acc); outline-offset: -1px; }
textarea.field { min-height: 92px; resize: vertical; }
.btn { border-radius: 12px; background: var(--card); color: var(--ink); border: 1px solid var(--line); padding: 12px 18px; font-weight: 600; text-decoration: none; display: inline-block; }
.btn.day { background: var(--acc); color: var(--onacc); border-color: var(--acc); }
.btn:disabled { opacity: .4; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 13px; font-size: 14px; }
.chip.on { background: var(--acc); color: var(--onacc); border-color: var(--acc); }
.lbl2 { font-size: 13px; color: var(--muted); margin: 14px 2px 6px; display: block; }
.ck2 { display: flex; align-items: center; gap: 10px; margin: 12px 2px 0; font-size: 15px; }
.ck2 input { width: 20px; height: 20px; accent-color: var(--acc); }
.people { font-size: 14px; margin: 4px 0; }
.people .r { display: inline-block; width: 18px; color: var(--muted); }
.desc { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; max-height: 220px; overflow: auto; }
.menu { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 8px; text-decoration: none; color: var(--ink); }
.menu i { font-size: 22px; font-style: normal; width: 26px; text-align: center; }
.menu small { display: block; color: var(--muted); font-size: 12px; }

.mail { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-top: 8px; }
.mrow { display: flex; align-items: stretch; }
.mail .mb { flex: 1; min-width: 0; text-align: left; background: none; border: 0; color: var(--ink); padding: 10px 6px 10px 14px; }
.mail .l1 { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.mail .l1 b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail .l1 span { color: var(--muted); font-size: 12px; white-space: nowrap; }
.mail .l2 { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail .l3 { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mail.open .l2 { white-space: normal; font-weight: 600; }
.mail.open .l3 { display: none; }
.mail .mt { flex: none; width: 60px; border: 0; border-left: 1px solid var(--line); background: none; color: var(--muted); font-size: 12px; }
.mexp { border-top: 1px solid var(--line); padding: 10px 14px 12px; }
.mbody { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; max-height: 55vh; overflow: auto; }
.mact { display: flex; gap: 8px; margin-top: 12px; }
.thread { display: block; text-decoration: none; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.thread:first-of-type { border-top: 0; }

.moods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.moods button { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 0 6px; font-size: 26px; line-height: 1.1; }
.moods button small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.moods button.on { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc) inset; background: var(--soft); }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale button { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 0; font-weight: 600; }
.scale button.on { border-color: var(--acc); background: var(--acc); color: var(--onacc); }
.scalehint { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 3px; }
.saved { font-size: 12px; color: var(--muted); text-align: right; min-height: 16px; }
.facts ul { margin: 4px 0 8px; padding-left: 18px; font-size: 14px; }
.facts li { margin: 3px 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: none; padding: 8px 14px; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--acc); color: var(--onacc); font-weight: 600; }
.hrow { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 2px; }
.hrow:first-of-type { border-top: 0; }
.hrow .em { font-size: 26px; width: 34px; text-align: center; }
.hrow .hd2 { font-weight: 600; }
.hrow .sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; display: block; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 15px; }
.kv .k { color: var(--muted); }
svg text { fill: var(--muted); font-size: 10px; font-family: inherit; }
.prow { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 8px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 11px 2px; }
.prow:first-of-type { border-top: 0; }
.prow .r { text-align: right; }
.prow .sym { font-weight: 600; }
.prow small { display: block; font-size: 12px; color: var(--muted); }
.up { color: var(--good); } .down { color: var(--danger); }
.tot { font-size: 32px; font-weight: 600; letter-spacing: -.5px; }
.pline { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0 2px; margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.pline b { color: var(--ink); font-weight: 500; }
.rd { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; }
.rd .n { font-size: 34px; font-weight: 600; line-height: 1; min-width: 52px; }
.rd .n small { font-size: 14px; font-weight: 400; color: var(--muted); }
.rd .t b { display: block; font-weight: 600; }
.rd .t span { display: block; font-size: 12px; color: var(--muted); }
.bar2 { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; margin-top: 4px; }
.bar2 i { display: block; height: 100%; background: var(--ink); border-radius: 3px; }
@keyframes fromRight { from { transform: translateX(32px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fromLeft { from { transform: translateX(-32px); opacity: 0; } to { transform: none; opacity: 1; } }
.slide-next { animation: fromRight .2s ease-out; }
.slide-prev { animation: fromLeft .2s ease-out; }
@media (prefers-reduced-motion: reduce) { .slide-next, .slide-prev { animation: none; } }
.back { border: 0; background: none; color: var(--muted); font-size: 14px; padding: 4px 0; }

.set h3 { margin: 0 0 8px; font-size: 15px; }
.set p { margin: 6px 0; font-size: 14px; }
.errbox { background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; word-break: break-word; margin-top: 8px; }
.okbox { background: var(--good-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; word-break: break-word; margin-top: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 30; max-width: 92vw; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; display: flex; gap: 14px; align-items: center; font-size: 14px; }
.toast button { background: none; border: 0; color: var(--bg); font-weight: 700; text-decoration: underline; padding: 0; }
[hidden] { display: none !important; }
.swmeta{font-size:12px;line-height:1.5}.swday h3{margin:0 0 8px}.swtoday{border-color:var(--acc)}.swactivity{padding:10px 0;border-top:1px solid var(--line)}.swline{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.swline b{overflow-wrap:anywhere;min-width:0}.swstate{font-size:11px;white-space:nowrap;border:1px solid var(--line);border-radius:9px;padding:2px 6px}.swdone{color:var(--good)}.swbuttons{margin:8px 0 0}.swbuttons .btn{font-size:12px;min-height:36px}.swcontrols .btn{min-width:40px}.swsummary{align-items:center}.swsummary .pill{flex-shrink:0;font-size:12px}.swsummary .btn{flex:1;min-width:135px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav" id="nav"></nav>
<div id="fabslot"></div>
<div id="overlay"></div>
<div id="toast"></div>

<script src="4-myday-sports-app.js"></script>
</body>
  </html>
